[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-understanding"
version = "0.1.0"
description = "Local-first, self-hostable video understanding API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "video-understanding contributors" }]
keywords = ["video", "understanding", "whisper", "ollama", "local-first", "ffmpeg"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Local speech-to-text. faster-whisper is CTranslate2-based and is the most
# practical option on Apple Silicon CPU (int8) as of the MVP.
whisper = ["faster-whisper>=1.0.0"]
# Content-aware scene detection. Pulls in OpenCV, which is why it is optional:
# without it the pipeline falls back to FFmpeg's `scene` filter, which needs no
# extra dependencies at all.
scenes = ["scenedetect>=0.6.4"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
all = ["video-understanding[whisper,scenes]"]

[project.scripts]
video-understand = "video_understanding.cli.main:main"

[project.urls]
Homepage = "https://github.com/vikramchand/video-editing-tool"

[tool.hatch.build.targets.wheel]
packages = ["video_understanding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "ffmpeg: test requires a working ffmpeg/ffprobe on PATH",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
