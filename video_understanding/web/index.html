<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Understanding</title>
<link rel="icon" href="data:,">

<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1d212a; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #9aa4b8; --accent: #5b9dff; --good: #3ecf8e;
    --warn: #f5a524; --bad: #f4526b; --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  main { max-width: 1240px; margin: 0 auto; padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 0 0 12px; font-weight: 600;
  }

  #drop {
    border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 40px 20px; text-align: center; cursor: pointer; transition: .15s;
  }
  #drop:hover, #drop.over { border-color: var(--accent); background: var(--panel-2); }
  #drop.over { transform: scale(1.005); }
  #drop p { margin: 6px 0; }
  #drop .hint { color: var(--muted); font-size: 12px; }

  .bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin: 10px 0 6px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .status-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

  video { width: 100%; border-radius: var(--radius); background: #000; display: block; }

  .scene, .hl, .edit, .seg {
    padding: 8px 10px; border-radius: 6px; background: var(--panel-2);
    margin-bottom: 6px; cursor: pointer; border-left: 3px solid transparent;
  }
  .scene:hover, .hl:hover, .edit:hover, .seg:hover { border-left-color: var(--accent); }
  .t { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 12px; margin-right: 8px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .tag {
    display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px;
    background: #263041; color: var(--muted); margin: 2px 4px 0 0;
  }
  .act { font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .act.remove { color: var(--bad); } .act.trim { color: var(--warn); }
  .act.caption, .act.zoom, .act.broll, .act.keep { color: var(--good); }

  .timeline { position: relative; height: 40px; background: var(--panel-2); border-radius: 6px; overflow: hidden; }
  .timeline .blk { position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--bg); opacity: .85; }
  .timeline .blk:hover { opacity: 1; outline: 1px solid var(--text); }
  .timeline .marker { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; pointer-events: none; }

  .scroll { max-height: 340px; overflow-y: auto; }
  pre {
    background: #0b0d12; border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; overflow: auto; max-height: 420px; font-size: 12px;
    color: #c9d3e3; margin: 0;
  }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 7px 13px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08121f; font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  label.chk { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .err { color: var(--bad); } .ok { color: var(--good); } .muted { color: var(--muted); }
  .warn-box { border-left: 3px solid var(--warn); padding: 6px 10px; background: var(--panel-2); border-radius: 4px; margin-bottom: 6px; font-size: 12px; }
  .hidden { display: none !important; }
  .summary { font-size: 15px; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <h1>Video Understanding</h1>
  <span class="sub">local-first &middot; no cloud APIs</span>
  <span class="spacer"></span>
  <span class="sub" id="health">checking&hellip;</span>
</header>

<main>
  <!-- Upload ------------------------------------------------------------ -->
  <div class="panel" id="upload-panel">
    <div id="drop">
      <p><strong>Drop a video here</strong> or click to choose a file</p>
      <p class="hint" id="limits">mp4, mov, m4v, avi, mkv, webm</p>
    </div>
    <input type="file" id="file" accept="video/*" class="hidden">
    <div id="progress" class="hidden">
      <div class="bar"><div id="bar-fill"></div></div>
      <div class="status-row">
        <span id="stage">queued</span><span id="pct">0%</span>
      </div>
    </div>
    <div id="error" class="err hidden" style="margin-top:10px"></div>
  </div>

  <!-- Results ----------------------------------------------------------- -->
  <div id="results" class="hidden">
    <div class="grid">
      <div>
        <div class="panel">
          <h2>Preview</h2>
          <video id="player" controls preload="metadata"></video>
          <div class="timeline" id="timeline" style="margin-top:10px"></div>
          <div class="status-row" style="margin-top:6px">
            <span class="muted" id="tl-left">0.0s</span>
            <span class="muted" id="tl-hint">scene timeline &mdash; click to seek</span>
            <span class="muted" id="tl-right"></span>
          </div>
        </div>

        <div class="panel">
          <h2>Summary</h2>
          <div id="title" style="font-weight:600;margin-bottom:6px"></div>
          <div class="summary" id="summary"></div>
          <div id="topics" style="margin-top:8px"></div>
          <div class="meta" id="stats" style="margin-top:10px"></div>
          <div id="warnings" style="margin-top:10px"></div>
        </div>

        <div class="panel">
          <h2>Highlights</h2>
          <div id="highlights"></div>
        </div>

        <div class="panel">
          <h2>Edit &amp; Render</h2>
          <div id="edits" class="scroll" style="margin-bottom:12px"></div>
          <div class="row">
            <label class="chk"><input type="checkbox" id="opt-remove" checked> apply removals</label>
            <label class="chk"><input type="checkbox" id="opt-captions"> burn captions</label>
            <label class="chk"><input type="checkbox" id="opt-highlights"> highlights only</label>
          </div>
          <div class="row" style="margin-top:10px">
            <button class="primary" id="btn-render">Render edit</button>
            <button id="btn-download" disabled>Download</button>
            <button id="btn-srt">Download .srt</button>
            <span id="render-status" class="muted"></span>
          </div>
        </div>
      </div>

      <div>
        <div class="panel">
          <h2>Scenes (<span id="scene-count">0</span>)</h2>
          <div id="scenes" class="scroll"></div>
        </div>

        <div class="panel">
          <h2>Transcript (<span id="seg-count">0</span>)</h2>
          <div id="transcript" class="scroll"></div>
        </div>

        <div class="panel">
          <h2>Raw JSON</h2>
          <div class="row" style="margin-bottom:10px">
            <button id="btn-copy">Copy JSON</button>
            <button id="btn-json">Download JSON</button>
          </div>
          <pre id="json"></pre>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let videoId = null;
let result = null;
let poller = null;

// --- Health -----------------------------------------------------------------
fetch("/health").then((r) => r.json()).then((h) => {
  const cls = h.status === "ok" ? "ok" : "err";
  const bad = Object.entries(h.providers)
    .filter(([, v]) => !v.startsWith("ok")).map(([k]) => k);
  $("health").innerHTML =
    `<span class="${cls}">${h.status}</span> &middot; v${h.version}` +
    (bad.length ? ` &middot; <span class="err">unavailable: ${bad.join(", ")}</span>` : "");
}).catch(() => { $("health").innerHTML = '<span class="err">API unreachable</span>'; });

fetch("/v1/config").then((r) => r.json()).then((c) => {
  $("limits").textContent =
    `${c.video.allowed_extensions.join(", ")} · max ${c.video.max_duration_seconds}s · ` +
    `max ${c.video.max_upload_mb}MB · ${c.video.frames_per_scene} frames/scene`;
}).catch(() => {});

// --- Upload -----------------------------------------------------------------
const drop = $("drop");
drop.addEventListener("click", () => $("file").click());
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  if (e.dataTransfer.files.length) upload(e.dataTransfer.files[0]);
});
$("file").addEventListener("change", (e) => {
  if (e.target.files.length) upload(e.target.files[0]);
});

function showError(message) {
  $("error").textContent = message;
  $("error").classList.remove("hidden");
  $("progress").classList.add("hidden");
}

async function upload(file) {
  $("error").classList.add("hidden");
  $("results").classList.add("hidden");
  $("progress").classList.remove("hidden");
  setProgress("uploading", 0.02);

  const body = new FormData();
  body.append("file", file);

  let response;
  try {
    response = await fetch("/v1/videos", { method: "POST", body });
  } catch (err) {
    return showError("Upload failed: " + err.message);
  }

  const data = await response.json().catch(() => ({}));
  if (!response.ok) return showError(data.detail || `Upload failed (HTTP ${response.status})`);

  videoId = data.video_id;
  setProgress("queued", 0.05);
  poll();
}

function setProgress(stage, fraction) {
  $("stage").textContent = String(stage).replace(/_/g, " ");
  $("pct").textContent = Math.round(fraction * 100) + "%";
  $("bar-fill").style.width = (fraction * 100) + "%";
}

function poll() {
  clearInterval(poller);
  poller = setInterval(async () => {
    let status;
    try {
      status = await (await fetch(`/v1/videos/${videoId}/status`)).json();
    } catch { return; }

    setProgress(status.stage, status.progress);

    if (status.status === "completed") {
      clearInterval(poller);
      loadResult();
    } else if (status.status === "failed") {
      clearInterval(poller);
      showError(status.error || "Processing failed");
    }
  }, 900);
}

async function loadResult() {
  const data = await (await fetch(`/v1/videos/${videoId}`)).json();
  result = data.result;
  $("progress").classList.add("hidden");
  $("results").classList.remove("hidden");
  render();
  $("results").scrollIntoView({ behavior: "smooth", block: "start" });
}

// --- Rendering the result ---------------------------------------------------
function render() {
  const player = $("player");
  player.src = `/v1/videos/${videoId}/source`;

  $("title").textContent = result.title || "";
  $("summary").textContent = result.summary || "(no summary)";
  $("topics").innerHTML = (result.topics || [])
    .map((t) => `<span class="tag">${esc(t)}</span>`).join("");

  const m = result.metadata || {};
  $("stats").textContent =
    `${result.duration.toFixed(1)}s · ${m.width}×${m.height} · ${(m.fps || 0).toFixed(1)} fps · ` +
    `${result.scenes.length} scenes · ${result.transcript.length} transcript segments · ` +
    `${result.highlights.length} highlights`;

  $("warnings").innerHTML = (result.warnings || [])
    .map((w) => `<div class="warn-box">${esc(w)}</div>`).join("");

  renderTimeline();
  renderScenes();
  renderHighlights();
  renderEdits();
  renderTranscript();

  $("json").textContent = JSON.stringify(result, null, 2);
  $("tl-right").textContent = result.duration.toFixed(1) + "s";
}

function seek(t) {
  const player = $("player");
  player.currentTime = t;
  player.play().catch(() => {});
}

function renderTimeline() {
  const total = result.duration || 1;
  const timeline = $("timeline");
  const hues = [210, 150, 35, 280, 0, 190, 100, 320];

  timeline.innerHTML = result.scenes.map((scene, index) => {
    const left = (scene.start / total) * 100;
    const width = Math.max(0.4, ((scene.end - scene.start) / total) * 100);
    const light = 26 + Math.round(scene.importance * 34);
    return `<div class="blk" data-t="${scene.start}"
      style="left:${left}%;width:${width}%;background:hsl(${hues[index % hues.length]} 55% ${light}%)"
      title="Scene ${scene.id}: ${esc(scene.description).slice(0, 90)}"></div>`;
  }).join("") + '<div class="marker" id="tl-marker" style="left:0"></div>';

  timeline.querySelectorAll(".blk").forEach((block) =>
    block.addEventListener("click", () => seek(parseFloat(block.dataset.t))));

  $("player").addEventListener("timeupdate", () => {
    const marker = $("tl-marker");
    if (marker) marker.style.left = (($("player").currentTime / total) * 100) + "%";
    $("tl-left").textContent = $("player").currentTime.toFixed(1) + "s";
  });
}

function renderScenes() {
  $("scene-count").textContent = result.scenes.length;
  $("scenes").innerHTML = result.scenes.map((scene) => {
    const tags = [
      ...scene.people.map((p) => `<span class="tag">${esc(p)}</span>`),
      ...scene.objects.map((o) => `<span class="tag">${esc(o)}</span>`),
      ...scene.actions.map((a) => `<span class="tag">${esc(a)}</span>`),
    ].join("");
    return `<div class="scene" data-t="${scene.start}">
      <div><span class="t">${fmt(scene.start)}–${fmt(scene.end)}</span>
        <span class="muted">importance ${scene.importance.toFixed(2)}</span></div>
      <div>${esc(scene.description)}</div>
      ${tags ? `<div>${tags}</div>` : ""}
      ${scene.transcript_text ? `<div class="meta">“${esc(scene.transcript_text.slice(0, 160))}”</div>` : ""}
    </div>`;
  }).join("");
  bindSeek("#scenes .scene");
}

function renderHighlights() {
  $("highlights").innerHTML = result.highlights.length
    ? result.highlights.map((h) => `<div class="hl" data-t="${h.start}">
        <div><span class="t">${fmt(h.start)}–${fmt(h.end)}</span>
          <strong>${esc(h.title || "Highlight")}</strong>
          <span class="muted">score ${h.score.toFixed(2)}</span></div>
        <div class="meta">${esc(h.reason)}</div></div>`).join("")
    : '<div class="muted">No highlights identified.</div>';
  bindSeek("#highlights .hl");
}

function renderEdits() {
  $("edits").innerHTML = result.edit_suggestions.length
    ? result.edit_suggestions.map((e) => `<div class="edit" data-t="${e.start}">
        <div><span class="t">${fmt(e.start)}–${fmt(e.end)}</span>
          <span class="act ${esc(e.action)}">${esc(e.action)}</span></div>
        <div class="meta">${esc(e.reason)}</div></div>`).join("")
    : '<div class="muted">No edit suggestions.</div>';
  bindSeek("#edits .edit");
}

function renderTranscript() {
  $("seg-count").textContent = result.transcript.length;
  $("transcript").innerHTML = result.transcript.length
    ? result.transcript.map((s) => `<div class="seg" data-t="${s.start}">
        <span class="t">${fmt(s.start)}</span>${esc(s.text)}</div>`).join("")
    : '<div class="muted">No speech detected.</div>';
  bindSeek("#transcript .seg");
}

function bindSeek(selector) {
  document.querySelectorAll(selector).forEach((element) =>
    element.addEventListener("click", () => seek(parseFloat(element.dataset.t))));
}

// --- Actions ----------------------------------------------------------------
$("btn-render").addEventListener("click", async () => {
  const button = $("btn-render");
  button.disabled = true;
  $("render-status").textContent = "rendering…";

  try {
    const response = await fetch(`/v1/videos/${videoId}/render`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        apply_removals: $("opt-remove").checked,
        burn_captions: $("opt-captions").checked,
        highlights_only: $("opt-highlights").checked,
      }),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);

    $("render-status").innerHTML =
      `<span class="ok">done</span> ${data.source_duration.toFixed(1)}s → ` +
      `${data.output_duration.toFixed(1)}s (${data.segments_kept} segment(s))`;
    $("btn-download").disabled = false;
  } catch (err) {
    $("render-status").innerHTML = `<span class="err">${esc(err.message)}</span>`;
  } finally {
    button.disabled = false;
  }
});

$("btn-download").addEventListener("click", () => {
  window.location = `/v1/videos/${videoId}/render/download`;
});
$("btn-srt").addEventListener("click", () => {
  window.location = `/v1/videos/${videoId}/transcript.srt`;
});
$("btn-copy").addEventListener("click", async () => {
  await navigator.clipboard.writeText(JSON.stringify(result, null, 2));
  $("btn-copy").textContent = "Copied";
  setTimeout(() => ($("btn-copy").textContent = "Copy JSON"), 1400);
});
$("btn-json").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(result, null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `${videoId}.json`;
  link.click();
  URL.revokeObjectURL(link.href);
});
</script>
</body>
</html>
